[project]
name = "cogni_agent"
version = "1.0.0"
description = "cogni_agent · 智能体平台后端"
requires-python = ">=3.12,<3.14"
readme = "README.md"
authors = [{ name = "zhilv-team" }]
dependencies = [
    "pymilvus>=2.4",   # 向量后端(Milvus);pgvector 仍作为可选后端保留
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.5",
    "redis>=5.1.1",
    "loguru>=0.7.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4(最后一次发版在 2020 年)不认识 bcrypt>=4.1 之后的行为变化
    # (bcrypt 移除了 __about__、且对超长密码从"静默截断"改成了抛 ValueError),
    # 会在首次调用 hash_password() 时直接报错。在 passlib 有对应修复发布之前,
    # 显式钉住一个兼容版本,而不是任由 uv/pip 装到最新的 bcrypt。
    "bcrypt>=4.0.0,<4.1.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "langchain-core>=1.5.0",
    "litellm>=1.49.0",
    "jsonschema>=4.23.0",
    "casbin>=1.36.4",
    "casbin-sqlalchemy-adapter>=1.3.0",
    "httpx>=0.27.2",
    "minio>=7.2.9",   # 上传文件的对象存储(bucket zhilv-artifacts);不可用时自动落库兜底
    "sse-starlette>=2.1.3",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.1",
    "greenlet>=3.5.3",
    "playwright>=1.62.0",
    "openpyxl>=3.1.0",   # Quick BI 小Q解读:上传的 xlsx 本地转 Markdown(csv 不需要)
    # 结果压缩(apidoc/digest)与全部内置数据工具(sys_table_*)都直接 import pandas。
    # 以前它只是别的包的传递依赖 —— 那意味着上游哪天不依赖它了,我们这边会在
    # **运行时**才炸,而且炸的是「用户问了个要统计的问题」这条路径,不是启动时。
    # 直接依赖就要直接声明。numpy 由 pandas 带入(sys_table_trend 的拟合用它)。
    "pandas>=2.2.0",
]

[project.optional-dependencies]
clip = ["open-clip-torch>=2.26.1"]
# 知识中心/工具中心·数据库查询工具需要连接 MySQL 协议兼容库(MySQL/SelectDB/StarRocks)
# 或 ClickHouse 时装这组;不装也不影响其余功能,只有真正调用到这两类数据源时才会报错提示安装。
db-connectors = ["aiomysql>=0.2.0", "clickhouse-connect>=0.8.0"]
# Quick BI 小Q解读支持老版 .xls(Excel 97-2003);不装时提示用户另存为 .xlsx
quickbi-xls = ["xlrd>=2.0.1"]
# 读用户上传的文件(sys_read_file)。**分成可选组是有意的**:
# OCR 依赖系统里的 tesseract 二进制和语言包(中文要 tesseract-ocr-chi-sim),
# 不是 pip 装一下就有;把它塞进主依赖,会让没有 OCR 需求的部署也被迫背上这套东西。
# 不装时 sys_read_file 只是少几种格式,并会明确告诉模型「缺什么、装什么」,
# 而不是抛一句 ImportError —— 模型看到 Python 报错会当成「工具坏了」然后开始猜文件内容。
file-reading = [
  "python-docx>=1.1.0",    # Word 正文与表格
  "pdfplumber>=0.11.0",    # PDF 文字(带表格;退化后端 pypdf 随它一起装)
  "pillow>=10.4.0",        # 图片解码
  "pytesseract>=0.3.13",   # OCR(还需要系统装 tesseract-ocr 与语言包)
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "black>=24.10.0",
]

[project.scripts]
cogni-seed-superadmin = "scripts.seed_superadmin:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogni_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 所有测试共享同一 event loop(等效旧版 conftest 的 session 级 event_loop)。
# 应用侧 Redis 客户端为模块级单例,连接绑定首次使用的 loop;
# 若每个测试各自建 loop,单例连接在后续测试的 loop 关闭后 GC 时会抛
# "Event loop is closed"。共享 loop 可避免该跨 loop 复用问题。
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
