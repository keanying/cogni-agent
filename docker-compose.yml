services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhilv}
      POSTGRES_USER: ${POSTGRES_USER:-zhilv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhilv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

# 注意:本文件只定义本地开发用的基础设施(postgres/redis/minio)。
# 应用本体(后端)由本地 uvicorn --reload 运行以支持热更新,不进 Docker 镜像。
# 开发环境部署走 Jenkins(K8s),由 Dockerfile 构建镜像,不依赖本文件。

volumes:
  pgdata:
  miniodata:
