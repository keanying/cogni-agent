# Casbin RBAC 模型(M7-08 / 架构图 ⑦ evals·policy)
#
# 请求三元组: 角色(sub) × 资源(obj) × 动作(act)
# 角色继承(g): 高权限角色继承低权限角色的全部策略,避免同一条权限写很多遍。
#
# 为什么模型文件要放在 config/ 而不是运行时写到 /tmp:
# 原实现每次初始化都往 /tmp 写一份再读回来,这在只读根文件系统的容器里直接失败,
# 多实例部署时也各写各的;而且模型是**配置**,本来就该随代码一起版本化、可 review。

[request_definition]
r = sub, obj, act, domain

[policy_definition]
p = sub, obj, act, domain

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

# obj 支持 keyMatch2 通配(如 tool:* 覆盖 tool:create / tool:delete),
# act 支持 * 通配。domain 用于区分管理端(admin)和 APP 端(app)的权限。
[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*") && r.domain == p.domain
